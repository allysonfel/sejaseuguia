<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seja Seu Guia</title>
<style>
  html,body{margin:0;height:100%;background:#101B3B;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 28px;box-sizing:border-box}
  .ic{width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.08);display:grid;place-items:center;margin-bottom:22px}
  h1{font-size:22px;margin:0 0 10px}
  p{font-size:15px;line-height:1.55;color:rgba(255,255,255,.75);margin:0 0 26px;max-width:300px}
  button{background:#F5B700;color:#101B3B;border:0;border-radius:14px;font-weight:800;font-size:16px;padding:15px 28px;width:100%;max-width:300px}
</style>
</head>
<body>
<main>
  <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F5B700" stroke-width="2" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg></div>
  <h1>Sem conexão</h1>
  <p>Não conseguimos abrir o Seja Seu Guia agora. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <p style="font-size:13px;margin-top:-14px">O roteiro em PDF que você salvou continua no seu celular.</p>
  <button onclick="tentar()">Tentar de novo</button>
</main>
<script>
  // Mesmo endereço do server.url do capacitor.config.ts.
  var URL_APP = "https://sejaseuguia-production.up.railway.app";
  function tentar() { location.replace(URL_APP); }
  window.addEventListener("online", tentar);
</script>
</body>
</html>
